<!doctype html>
<!-- The terminal beside the office: xterm.js draws it, Terminal.swift runs a shell on a
     pseudo-terminal for each tab. Bytes cross as base64 (termWrite) one way and as text messages,
     each with its tab's id, the other. The page owns the tabs: it asks for a shell when it opens
     one ("open") and says when it closes one ("close"). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1a26; }
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 24px; display: flex; align-items: stretch;
         background: #15131d; border-bottom: 1px solid #2c2838; font: 11px -apple-system, system-ui, sans-serif;
         color: #9a93b0; user-select: none; -webkit-user-select: none; }
  /* more tabs than fit: the row scrolls sideways (wheel, trackpad, or the ‹ › that show only then) */
  #tabs { display: flex; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  #grip, #add, #hide { flex: 0 0 auto; }
  .more { width: 18px; flex: 0 0 auto; text-align: center; line-height: 23px; font-size: 13px; cursor: default; }
  .more:hover { color: #e6e1f0; background: #2c2838; }
  .more.off { color: #3a3550; background: none; }
  #grip { width: 22px; display: flex; align-items: center; justify-content: center; cursor: grab;
          border-right: 1px solid #2c2838; color: #6f6888; }
  #grip:hover { color: #e6e1f0; background: #221f2c; }
  .tab { display: flex; align-items: center; gap: 4px; padding: 0 4px 0 10px; flex: 0 1 180px; min-width: 96px;
         border-right: 1px solid #2c2838; cursor: default; }
  .tab .name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { width: 16px; height: 16px; line-height: 15px; text-align: center; border-radius: 3px; visibility: hidden; }
  .tab:hover .x, .tab.on .x { visibility: visible; }
  .tab .x:hover { background: #3a3550; color: #e6e1f0; }
  .tab:hover { color: #cfc8e2; }
  .tab.on { background: #1c1a26; color: #e6e1f0; box-shadow: inset 0 2px 0 #f2c14e; }
  #add { width: 28px; text-align: center; line-height: 23px; font-size: 15px; cursor: default; }
  #add:hover { color: #e6e1f0; background: #2c2838; }
  #hide { width: 28px; text-align: center; line-height: 23px; font-size: 13px; cursor: default; border-left: 1px solid #2c2838; }
  #hide:hover { color: #e6e1f0; background: #3a3550; }
  #panes { position: absolute; top: 29px; right: 0; bottom: 0; left: 6px; }
  .pane { position: absolute; inset: 0; }
  .xterm .xterm-viewport { background-color: #1c1a26 !important; }
  .xterm .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
  .xterm .xterm-viewport::-webkit-scrollbar-thumb { background: #4a4366; border-radius: 4px; }
</style>
</head><body>
<div id="bar"><div id="grip" title="Drag to move the terminal to another side of the window">⠿</div><div id="left" class="more" title="Scroll the tabs left" hidden>‹</div><div id="tabs"></div><div id="right" class="more" title="Scroll the tabs right" hidden>›</div><div id="add" title="New tab (⌘T)">+</div><div id="hide" title="Hide the terminal (⌃\`): its tabs and shells keep running, open it again to carry on">✕</div></div>
<div id="panes"></div>
<script src="vendor/xterm/xterm.js"></script>
<script src="vendor/xterm/addon-fit.js"></script>
<script>
const post = m => window.webkit.messageHandlers.term.postMessage(m);
const OPTS = {
  // MesloLGS NF first: the font Powerlevel10k and other Nerd Font prompts draw their icons with
  fontFamily: '"MesloLGS NF", "SF Mono", Menlo, Monaco, monospace',
  fontSize: 13,
  cursorBlink: true,
  scrollback: 10000,
  // Option types the layout's own characters (@, [, { on many keyboards) instead of Meta
  macOptionIsMeta: false,
  theme: {
    background: '#1c1a26', foreground: '#e6e1f0', cursor: '#f2c14e', cursorAccent: '#1c1a26',
    selectionBackground: '#4a4366',
  },
};
const tabsEl = document.getElementById('tabs'), panes = document.getElementById('panes');
const tabs = [];
let cur = null, nextId = 1;
const byId = id => tabs.find(t => t.id === id);

// reveal: scroll the current tab into view (a new or picked tab); a title change leaves the row where it is
function render(reveal) {
  tabsEl.replaceChildren(...tabs.map((t, i) => {
    const el = document.createElement('div');
    t.tabEl = el;
    el.className = 'tab' + (t === cur ? ' on' : '');
    el.title = (t.title || 'Shell') + (i < 9 ? `  (⌘${i + 1})` : '');
    const name = document.createElement('span'); name.className = 'name';
    name.textContent = t.title || `Shell ${i + 1}`;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'Close tab';
    x.onmousedown = e => e.stopPropagation();
    x.onclick = e => { e.stopPropagation(); closeTab(t); };
    el.onmousedown = e => { if (e.button === 0) { e.preventDefault(); select(t); } };
    el.onauxclick = e => { if (e.button === 1) closeTab(t); };     // middle click closes, as in a browser
    el.append(name, x);
    return el;
  }));
  if (reveal && cur && cur.tabEl) cur.tabEl.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  arrows();
  post({ t: 'tabs', n: tabs.length });
}

// the ‹ › show only while the tabs overflow, and fade at the end they cannot scroll past
const leftEl = document.getElementById('left'), rightEl = document.getElementById('right');
function arrows() {
  const over = tabsEl.scrollWidth > tabsEl.clientWidth + 1;
  leftEl.hidden = rightEl.hidden = !over;
  leftEl.classList.toggle('off', tabsEl.scrollLeft <= 0);
  rightEl.classList.toggle('off', tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 1);
}
const slide = dir => { tabsEl.scrollBy({ left: dir * Math.max(96, tabsEl.clientWidth * 0.6) }); arrows(); };
leftEl.onmousedown = e => { e.preventDefault(); slide(-1); };
rightEl.onmousedown = e => { e.preventDefault(); slide(1); };
tabsEl.addEventListener('scroll', arrows);
// a plain mouse wheel scrolls up and down: over the tabs it slides them sideways
tabsEl.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); tabsEl.scrollLeft += e.deltaY; arrows(); }
}, { passive: false });
// a narrower bar (a smaller window, the terminal moved to a side) keeps the current tab in view
new ResizeObserver(() => { if (cur && cur.tabEl) cur.tabEl.scrollIntoView({ block: 'nearest', inline: 'nearest' }); arrows(); }).observe(tabsEl);

function select(t) {
  if (!t) return;
  cur = t;
  for (const o of tabs) o.el.style.visibility = o === t ? 'visible' : 'hidden';
  try { t.fit.fit(); } catch (e) {}
  t.term.focus();
  render(true);
}

function newTab() {
  const id = nextId++;
  const el = document.createElement('div'); el.className = 'pane';
  panes.appendChild(el);
  const term = new Terminal(OPTS), fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  const t = { id, term, fit, el, exited: false, title: '' };
  tabs.push(t);
  select(t);                     // visible before it opens, so it measures the real size
  term.open(el);
  try { fit.fit(); } catch (e) {}
  // After the shell exits in the last tab, Return starts a new one; other keys wait until then.
  term.onData(d => {
    if (!t.exited) { post({ t: 'in', id, d }); return; }
    if (d === '\r') { t.exited = false; term.reset(); post({ t: 'restart', id, cols: term.cols, rows: term.rows }); }
  });
  // mouse reports in some modes arrive as raw bytes: each char is one byte (0-255)
  term.onBinary(d => { if (!t.exited) post({ t: 'bin', id, d }); });
  term.onResize(({ cols, rows }) => post({ t: 'resize', id, cols, rows }));
  term.onTitleChange(s => { t.title = s.trim(); render(); });  // the title a prompt sets (OSC 0/2)
  post({ t: 'open', id, cols: term.cols, rows: term.rows });
  term.focus();
}

function closeTab(t, quiet) {
  const i = tabs.indexOf(t);
  if (i < 0) return;
  if (!quiet) post({ t: 'close', id: t.id });
  tabs.splice(i, 1);
  t.term.dispose(); t.el.remove();
  if (!tabs.length) { newTab(); return; }                      // never an empty terminal
  if (cur === t) select(tabs[Math.min(i, tabs.length - 1)]); else render();
}

document.getElementById('add').onmousedown = e => { e.preventDefault(); newTab(); };
// ✕ only hides the pane: the app keeps every tab's shell, so opening it again carries on
document.getElementById('hide').onmousedown = e => { e.preventDefault(); post({ t: 'hide' }); };
// the grip: pressing it hands the drag to the app, which shows where the terminal would go
document.getElementById('grip').onmousedown = e => { e.preventDefault(); post({ t: 'drag' }); };
document.getElementById('bar').ondblclick = e => { if (e.target.id === 'tabs') newTab(); };
// ⌘1…⌘9 picks a tab (⌘9 the last), as in iTerm and the browsers
window.addEventListener('keydown', e => {
  if (e.metaKey && !e.altKey && !e.ctrlKey && e.key >= '1' && e.key <= '9') {
    e.preventDefault(); e.stopPropagation();
    select(e.key === '9' ? tabs[tabs.length - 1] : tabs[+e.key - 1]);
  }
}, true);
new ResizeObserver(() => { try { cur && cur.fit.fit(); } catch (e) {} }).observe(panes);

window.termWrite = (id, b64) => {
  const t = byId(id); if (!t) return;
  const s = atob(b64), u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
  t.term.write(u);
};
// A shell that exits closes its tab, as `exit` does in iTerm; the last tab stays, with a notice.
window.termExited = (id, status) => {
  const t = byId(id); if (!t) return;
  if (tabs.length > 1) { closeTab(t, true); return; }
  t.exited = true;
  t.term.write(`\r\n\x1b[2m[shell exited (${status}). Press Return for a new one.]\x1b[0m\r\n`);
};
window.termFocus = () => cur && cur.term.focus();
window.termNewTab = () => newTab();
window.termCloseTab = () => cur && closeTab(cur);
window.termStep = n => { if (cur) select(tabs[(tabs.indexOf(cur) + n + tabs.length) % tabs.length]); };

newTab();
</script>
</body></html>
